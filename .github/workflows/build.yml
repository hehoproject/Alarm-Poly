name: Auto Build PushClock Pro APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ekstrak Paket Proyek Android
        run: |
          cat << 'EOF' | tr -d ' \n\r' | base64 -d > project.zip
          
          EOF
          unzip -o project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PushClockPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
